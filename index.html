<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XToto - Videos & Fotos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#FF2B56',
                            darkRed: '#D1103A',
                            dark: '#0A0A0C',
                            card: '#121216',
                            border: '#23232A'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0A0A0C;
            color: #E2E8F0;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-brand-dark/90 backdrop-blur-md border-b border-brand-border px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-white">X<span class="text-brand-red">Toto</span></h1>
        <div class="flex items-center gap-3">
            <span class="text-xs bg-brand-red/20 text-brand-red px-2 py-1 rounded-full font-semibold">Online</span>
        </div>
    </header>

    <!-- Main Content Feed -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Contenedor donde aparecerán tus publicaciones -->
        <div id="feed-container" class="space-y-6">
            <!-- Aquí se cargarán tus videos públicos -->
        </div>

    </main>

    <!-- Script de configuración y carga de videos -->
    <script>
        // AQUÍ PUEDES AGREGAR TUS ENLACES DIRECTOS DE VIDEO (.mp4)
        // Reemplaza "TU_ENLACE_AQUI.mp4" con el enlace que obtengas de Catbox.moe o Cloudinary
        const PUBLIC_VIDEOS = [
            {
                id: 1,
                videoUrl: videoUrl: "https://files.catbox.moe/ypcsu9.mp4",
, 
                caption: "¡Bienvenidos a mi nuevo sitio web monetizado! 🚀",
                likes: 124
            }
        ];

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            PUBLIC_VIDEOS.forEach(post => {
                const card = document.createElement('div');
                card.className = "bg-brand-card border border-brand-border rounded-2xl overflow-hidden shadow-lg";
                
                card.innerHTML = `
                    <div class="relative bg-black aspect-[9/16] flex items-center justify-center">
                        <video controls class="w-full h-full object-contain" src="${post.videoUrl}" poster=""></video>
                    </div>
                    <div class="p-4 space-y-2">
                        <p class="text-sm text-gray-200">${post.caption}</p>
                        <div class="flex items-center justify-between text-xs text-gray-400 pt-2 border-t border-brand-border">
                            <button class="flex items-center gap-1 hover:text-brand-red transition">
                                <i class="fa-solid fa-heart text-brand-red"></i> <span>${post.likes}</span>
                            </button>
                            <span>Monetizado con VAST</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', renderFeed);
    </script>
</body>
</html>
